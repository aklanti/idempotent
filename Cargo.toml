[package]
name = "idempotent"
version = "1.1.0"
edition = "2024"
authors = ["Sede Soukossi"]
description = "Type-safe idempotency keys for building reliable, retry-safe APIs"
license = "MPL-2.0"
repository = "https://github.com/aklanti/idempotent"
rust-version = "1.98.0"
keywords = ["idempotency", "idempotent", "api", "retry", "deduplication"]
categories = ["web-programming", "data-structures"]

[package.metadata.docs.rs]
features = ["axum", "json", "memory", "middleware", "serde", "tracing", "uuid", "valkey"]

[features]
axum = ["dep:axum", "middleware"]
default = ["uuid"]
json = ["serde", "dep:serde_json"]
memory = []
middleware = [
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:pin-project-lite",
    "dep:sha2",
    "dep:tokio-util",
    "dep:tower",
]
serde = ["dep:serde", "bytes/serde", "uuid?/serde"]
tracing = ["dep:tracing"]
uuid = ["dep:uuid"]
valkey = ["dep:redis", "dep:postcard", "serde"]

[dependencies]
axum = { version = "0.8", default-features = false, optional = true }
bytes = { version = "1" }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
pin-project-lite = { version = "0.2", optional = true }
postcard = { version = "1", optional = true, features = ["alloc"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tracing = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dependencies.redis]
version = "1"
default-features = false
features = ["aio", "connection-manager", "tokio-rustls-comp", "script"]
optional = true

[dev-dependencies]
googletest = "0.14"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["valkey"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

[lints.clippy]
allow_attributes_without_reason = "warn"
missing_const_for_fn = "warn"
mod_module_files = "warn"
option_if_let_else = "warn"
panic_in_result_fn = "warn"
too_long_first_doc_paragraph = "warn"
unused_self = "deny"
unwrap_used = "deny"

[lints.rust]
non_snake_case = "allow"
trivial_numeric_casts = "warn"
unsafe_code = "forbid"
unused-lifetimes = "warn"
unused-macro-rules = "warn"
unused_import_braces = "warn"
unused_must_use = "deny"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_doc_tests = "warn"
unescaped_backticks = "warn"
